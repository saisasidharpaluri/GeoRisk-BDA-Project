[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "georisk-spark"
version = "0.1.0"
description = "Real-time geospatial supply-chain risk analytics demonstration"
requires-python = ">=3.10"
dependencies = [
    "h3>=4.5,<5",
    "jsonschema>=4.21,<5",
    "pyarrow>=16",
]

[project.scripts]
georisk = "georisk.cli:entry"
georisk-run = "georisk.pipeline:run_cli"
georisk-compare-resolutions = "georisk.analysis.resolution_comparison:comparison_cli"
georisk-validate = "georisk.operations:validate_cli"
georisk-deployment-check = "georisk.deployment:deployment_cli"

[project.optional-dependencies]
spark = [
    "pyspark>=3.5.4,<3.6",
    "pandas>=2,<3",
]
test = [
    "pytest>=8,<9",
    "duckdb>=1.5,<2",
]
dashboard = [
    "streamlit>=1.35,<2",
    "pydeck>=0.9,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
markers = ["spark: requires PySpark and a working Java runtime"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
georisk = ["schemas/README.md", "schemas/v1/*.json", "schemas/v1/examples/README.md", "schemas/v1/examples/*/*.json", "storage_analytics/sql/*.sql"]
