[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "georisk-spark"
version = "0.1.0"
description = "Real-time geospatial supply-chain risk analytics demonstration"
requires-python = ">=3.10"
dependencies = [
    "h3>=4.1,<5",
    "jsonschema>=4.21,<5",
    "pyarrow>=16,<22",
]

[project.scripts]
georisk-run = "georisk.pipeline:run_cli"
georisk-validate = "georisk.operations:validate_cli"
georisk-deployment-check = "georisk.deployment:deployment_cli"

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
]
dashboard = [
    "streamlit>=1.35,<2",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
